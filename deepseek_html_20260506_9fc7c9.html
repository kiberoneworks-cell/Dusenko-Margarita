<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Крестики-Нолики | Классическая игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1922 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Roboto', sans-serif;
            padding: 20px;
            margin: 0;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border-radius: 64px;
            padding: 24px 20px 32px 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .game-card {
            background: #1e2a36;
            border-radius: 48px;
            padding: 28px 24px 32px 24px;
            text-align: center;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #FFD966, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 12px;
        }

        .sub {
            font-size: 0.85rem;
            color: #8aaec0;
            margin-bottom: 20px;
            border-bottom: 1px dashed #3e5a6b;
            display: inline-block;
            padding-bottom: 5px;
        }

        .status {
            background: #0f1a21;
            padding: 14px 18px;
            margin: 20px auto 20px auto;
            border-radius: 60px;
            display: inline-block;
            width: auto;
            min-width: 200px;
            font-size: 1.55rem;
            font-weight: 600;
            text-align: center;
            color: #f2e8cf;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5), 0 5px 8px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background-color: #2c3e44;
            padding: 14px;
            border-radius: 42px;
            margin: 16px 0 20px 0;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.05), 0 12px 20px rgba(0, 0, 0, 0.4);
        }

        .cell {
            background: #0e1a22;
            border-radius: 28px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.2rem;
            font-weight: 800;
            font-family: 'Segoe UI', 'Poppins', monospace;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 8px 0 #03080e;
            color: #ffecd6;
            text-shadow: 0 3px 5px rgba(0, 0, 0, 0.4);
        }

        .cell:hover {
            transform: translateY(-3px);
            background: #1c2f3c;
            box-shadow: 0 10px 0 #03080e;
        }

        .cell:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #03080e;
        }

        /* победная подсветка */
        .cell.win-cell {
            background: radial-gradient(circle at 30% 20%, #b5d68b, #6f9e3f);
            color: #1e2f1a;
            text-shadow: none;
            box-shadow: 0 0 12px #b5ff80;
            transform: scale(1.02);
            transition: all 0.15s;
        }

        /* разные цвета для X и O */
        .cell[data-value="X"] {
            color: #6bc9ff;
            text-shadow: 0 2px 8px #0077ff80;
        }

        .cell[data-value="O"] {
            color: #ffad6a;
            text-shadow: 0 2px 8px #ff7700b3;
        }

        .reset-btn {
            background: linear-gradient(110deg, #2f4b5c, #1f3a48);
            border: none;
            color: #f7eac5;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 12px;
            width: 80%;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #0b141c;
            letter-spacing: 1px;
            font-family: inherit;
        }

        .reset-btn:hover {
            background: linear-gradient(110deg, #3e6377, #2a4a5c);
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #0b141c;
        }

        .reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0b141c;
        }

        footer {
            font-size: 0.7rem;
            margin-top: 18px;
            color: #7a95a3;
            opacity: 0.8;
        }

        @media (max-width: 500px) {
            .board {
                gap: 8px;
                padding: 12px;
            }
            .cell {
                font-size: 3rem;
                border-radius: 20px;
            }
            .status {
                font-size: 1.2rem;
                padding: 10px 16px;
                min-width: 160px;
            }
            .reset-btn {
                font-size: 1.1rem;
                padding: 10px 20px;
                width: 90%;
            }
            h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-card">
        <h1>✖ КРЕСТИКИ-НОЛИКИ ◯</h1>
        <div class="sub">классическая битва</div>

        <div class="status" id="statusMsg">Ход: X</div>

        <div id="boardContainer" class="board"></div>

        <button id="resetGameBtn" class="reset-btn">⟳ Новая игра</button>
        <footer>нажми на клетку — и победа ждёт!</footer>
    </div>
</div>

<script>
    (function(){
        // ---------- ИГРОВАЯ ЛОГИКА ----------
        let boardState = Array(9).fill(null);     // null, 'X' или 'O'
        let currentPlayer = 'X';                  // X всегда начинает
        let gameActive = true;
        
        // DOM элементы
        const boardContainer = document.getElementById('boardContainer');
        const statusDiv = document.getElementById('statusMsg');
        const resetButton = document.getElementById('resetGameBtn');
        
        let cellElements = [];     // массив из 9 HTML элементов
        
        // Все выигрышные комбинации (индексы полей)
        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],  // горизонтали
            [0, 3, 6], [1, 4, 7], [2, 5, 8],  // вертикали
            [0, 4, 8], [2, 4, 6]              // диагонали
        ];
        
        // ---------- Вспомогательные функции ----------
        // обновить текст статуса (ход или финальное сообщение)
        function updateStatusMessage(message = null) {
            if (message) {
                statusDiv.innerText = message;
            } else {
                if (gameActive) {
                    statusDiv.innerText = `Ход: ${currentPlayer}`;
                } else {
                    // если игра не активна, но сообщение уже должно быть выставлено,
                    // этот случай не перетираем, оставляем как есть
                    // на всякий случай проверяем, если сообщение пустое, ставим дефолт
                    if (statusDiv.innerText === "") statusDiv.innerText = "Игра окончена";
                }
            }
        }
        
        // убрать подсветку со всех клеток
        function clearWinHighlights() {
            cellElements.forEach(cell => {
                cell.classList.remove('win-cell');
            });
        }
        
        // подсветить выигрышную комбинацию
        function highlightWinningCells(combination) {
            if (!combination) return;
            clearWinHighlights();
            for (let idx of combination) {
                if (cellElements[idx]) {
                    cellElements[idx].classList.add('win-cell');
                }
            }
        }
        
        // проверка победителя: возвращает объект { winner: 'X'/'O'/null, combo: array|null }
        function checkWinnerOnBoard(board) {
            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return { winner: board[a], combo: pattern };
                }
            }
            return { winner: null, combo: null };
        }
        
        // проверка на ничью (все клетки заполнены и нет победителя)
        function isDraw(board) {
            return board.every(cell => cell !== null);
        }
        
        // завершение игры победой
        function endGameWithWin(winner, winCombo) {
            gameActive = false;
            highlightWinningCells(winCombo);
            const winMessage = winner === 'X' ? '✖ X ПОБЕДИЛ! ✖' : '◯ O ПОБЕДИЛ! ◯';
            statusDiv.innerText = winMessage;
        }
        
        // завершение игры ничьей
        function endGameWithDraw() {
            gameActive = false;
            clearWinHighlights();     // убираем возможные подсветки (если были)
            statusDiv.innerText = '🤝 НИЧЬЯ! 🤝';
        }
        
        // переключение игрока
        function switchPlayer() {
            currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
            if (gameActive) {
                updateStatusMessage();
            }
        }
        
        // обновить отображение доски из boardState
        function syncBoardUI() {
            for (let i = 0; i < 9; i++) {
                const mark = boardState[i];
                if (cellElements[i]) {
                    cellElements[i].innerText = mark || '';
                    if (mark === 'X') {
                        cellElements[i].setAttribute('data-value', 'X');
                    } else if (mark === 'O') {
                        cellElements[i].setAttribute('data-value', 'O');
                    } else {
                        cellElements[i].removeAttribute('data-value');
                    }
                }
            }
        }
        
        // обработка клика по клетке
        function handleCellClick(index) {
            // проверка: игра активна? клетка пустая?
            if (!gameActive) return;
            if (boardState[index] !== null) return;
            
            // ставим метку
            boardState[index] = currentPlayer;
            syncBoardUI();   // обновляем отображение сразу
            
            // проверка на победу
            const { winner, combo } = checkWinnerOnBoard(boardState);
            if (winner) {
                endGameWithWin(winner, combo);
                return;
            }
            
            // проверка на ничью
            if (isDraw(boardState)) {
                endGameWithDraw();
                return;
            }
            
            // если игра продолжается, меняем игрока
            switchPlayer();
        }
        
        // ---------- СБРОС ИГРЫ ----------
        function resetGame() {
            // очищаем состояние
            boardState.fill(null);
            currentPlayer = 'X';        // X начинает
            gameActive = true;
            
            // очищаем UI клеток
            syncBoardUI();
            
            // убираем подсветку и сбрасываем статус
            clearWinHighlights();
            updateStatusMessage(`Ход: X`);
            
            // дополнительные стилистические гарантии: 
            // убираем любые классы, связанные с победами у всех клеток
            cellElements.forEach(cell => {
                cell.classList.remove('win-cell');
            });
        }
        
        // ---------- СОЗДАНИЕ ДОСКИ (генерация 9 клеток) ----------
        function buildBoardUI() {
            boardContainer.innerHTML = ''; // очищаем контейнер
            cellElements = [];
            
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                // устанавливаем обработчик замыканием
                cell.addEventListener('click', (function(idx) {
                    return function() { handleCellClick(idx); };
                })(i));
                boardContainer.appendChild(cell);
                cellElements.push(cell);
            }
            // после создания синхронизируем пустую доску
            syncBoardUI();
        }
        
        // ---------- ИНИЦИАЛИЗАЦИЯ ИГРЫ ----------
        function initGame() {
            buildBoardUI();          // создать HTML клетки
            resetGame();            // установить все на стартовые позиции
        }
        
        // привязать событие кнопки сброса
        resetButton.addEventListener('click', () => {
            resetGame();
        });
        
        // Запускаем игру при загрузке страницы
        initGame();
    })();
</script>
</body>
</html>
