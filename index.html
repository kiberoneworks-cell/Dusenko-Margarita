<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KBER 1ONE | Многозначный счётчик 5/10/20/50</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #0b1120, #020408);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Inter', 'Montserrat', system-ui, sans-serif;
            padding: 20px;
        }

        /* главный контейнер */
        .counter-card {
            background: rgba(8, 15, 24, 0.7);
            backdrop-filter: blur(14px);
            border-radius: 70px;
            padding: 32px 28px 42px 28px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 180, 100, 0.2);
            width: 100%;
            max-width: 780px;
            transition: all 0.2s;
        }

        /* брендинг */
        .brand {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #FFE0A3, #FFAD5C, #FF7A2E);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .brand .sub {
            color: #83a7c2;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 5px;
        }

        /* дисплей */
        .value-panel {
            background: #03070ed9;
            border-radius: 60px;
            padding: 18px 20px;
            margin: 18px 0 22px 0;
            box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.6), 0 6px 14px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 155, 70, 0.4);
        }

        .counter-value {
            font-size: 6rem;
            font-weight: 800;
            text-align: center;
            font-family: 'Fira Mono', 'JetBrains Mono', monospace;
            color: #FFD6A5;
            text-shadow: 0 0 12px #ff8c42;
            transition: 0.08s linear;
            letter-spacing: 6px;
            word-break: break-word;
            line-height: 1.2;
        }

        /* эффект анимации при изменении */
        @keyframes flashCounter {
            0% { text-shadow: 0 0 2px #ffbc6e; opacity: 0.9; }
            100% { text-shadow: 0 0 22px #ffae4a, 0 0 8px #ff9940; }
        }
        .counter-value.changed {
            animation: flashCounter 0.2s cubic-bezier(0.2, 1.2, 0.4, 1);
        }

        /* секции кнопок */
        .controls-group {
            margin: 28px 0 12px;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            justify-content: center;
        }
        .section-label span {
            font-size: 0.85rem;
            font-weight: 600;
            background: #1f2e3a60;
            padding: 5px 16px;
            border-radius: 60px;
            color: #cbe4f5;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
        }

        .button-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .num-btn {
            background: linear-gradient(145deg, #1f2c36, #121d26);
            border: none;
            padding: 12px 20px;
            min-width: 80px;
            font-size: 1.4rem;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 6px 0 #050a0f;
            transition: 0.05s linear;
            font-family: 'Fira Mono', monospace;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #fadbbc;
        }
        .num-btn.inc {
            background: linear-gradient(145deg, #2c4a3c, #1a3328);
            color: #e9ffc2;
            box-shadow: 0 6px 0 #0f231a;
        }
        .num-btn.dec {
            background: linear-gradient(145deg, #462f2c, #2f201d);
            color: #ffc8a2;
            box-shadow: 0 6px 0 #241410;
        }
        .num-btn.reset-btn {
            background: linear-gradient(145deg, #32324b, #1f1f32);
            color: #fcd48d;
            font-size: 1.2rem;
            padding: 10px 24px;
            min-width: 110px;
            box-shadow: 0 6px 0 #13101f;
        }
        .num-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #050a0f;
        }
        .num-btn.reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #13101f;
        }

        /* цвета значения */
        .value-positive {
            color: #ffe2b5;
            text-shadow: 0 0 8px #ffae4a;
        }
        .value-negative {
            color: #ffbc93;
            text-shadow: 0 0 6px #ff7340;
        }
        .value-zero {
            color: #90c8f0;
            text-shadow: 0 0 6px #2f98ff;
        }

        .info-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.7rem;
            color: #698aa0;
            background: #030f1650;
            padding: 8px 12px;
            border-radius: 32px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(2px);
        }

        @media (max-width: 620px) {
            .counter-card {
                padding: 20px 16px 32px;
                border-radius: 48px;
            }
            .counter-value {
                font-size: 3.8rem;
                letter-spacing: 2px;
            }
            .num-btn {
                padding: 8px 14px;
                min-width: 65px;
                font-size: 1.2rem;
            }
            .button-grid {
                gap: 8px;
            }
            .brand h1 {
                font-size: 2rem;
                letter-spacing: 3px;
            }
        }
        @media (max-width: 480px) {
            .num-btn {
                padding: 6px 12px;
                min-width: 55px;
                font-size: 1rem;
            }
            .counter-value {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
<div class="counter-card">
    <div class="brand">
        <h1>KBER 1ONE</h1>
        <div class="sub">⚡ multi‑step counter | 1 / 5 / 10 / 20 / 50 ⚡</div>
    </div>

    <div class="value-panel">
        <div class="counter-value" id="counterDisplay">0</div>
    </div>

    <div class="controls-group">
        <!-- панель увеличения (+) -->
        <div class="section-label">
            <span>🔺 УВЕЛИЧЕНИЕ</span>
        </div>
        <div class="button-grid" id="incGroup">
            <button class="num-btn inc" data-inc="1">+1</button>
            <button class="num-btn inc" data-inc="5">+5</button>
            <button class="num-btn inc" data-inc="10">+10</button>
            <button class="num-btn inc" data-inc="20">+20</button>
            <button class="num-btn inc" data-inc="50">+50</button>
        </div>

        <!-- панель уменьшения (-) -->
        <div class="section-label">
            <span>🔻 УМЕНЬШЕНИЕ</span>
        </div>
        <div class="button-grid" id="decGroup">
            <button class="num-btn dec" data-dec="1">-1</button>
            <button class="num-btn dec" data-dec="5">-5</button>
            <button class="num-btn dec" data-dec="10">-10</button>
            <button class="num-btn dec" data-dec="20">-20</button>
            <button class="num-btn dec" data-dec="50">-50</button>
        </div>

        <!-- дополнительная кнопка сброса -->
        <div class="button-grid" style="margin-bottom: 0;">
            <button class="num-btn reset-btn" id="resetCounterBtn">⟳ СБРОС (0)</button>
        </div>
    </div>

    <div class="info-footer">
        ✦ клавиши: ↑ (+1)  |  ↓ (-1)  |  R / r — сброс ✦
    </div>
</div>

<script>
    (function() {
        // ========== СЧЕТЧИК KBER 1ONE ==========
        let currentValue = 0;
        const displaySpan = document.getElementById('counterDisplay');
        
        // все кнопки увеличения и уменьшения
        const incButtons = document.querySelectorAll('.num-btn.inc');
        const decButtons = document.querySelectorAll('.num-btn.dec');
        const resetBtn = document.getElementById('resetCounterBtn');
        
        // вспомогательная анимация
        let animTimer = null;
        function animateCounterFlash() {
            if (animTimer) clearTimeout(animTimer);
            displaySpan.classList.add('changed');
            animTimer = setTimeout(() => {
                displaySpan.classList.remove('changed');
            }, 200);
        }
        
        // обновить отображение в зависимости от знака
        function updateDisplay() {
            displaySpan.innerText = currentValue;
            // стилизация в зависимости от значения
            if (currentValue > 0) {
                displaySpan.classList.remove('value-zero', 'value-negative');
                displaySpan.classList.add('value-positive');
            } else if (currentValue < 0) {
                displaySpan.classList.remove('value-zero', 'value-positive');
                displaySpan.classList.add('value-negative');
            } else {
                displaySpan.classList.remove('value-positive', 'value-negative');
                displaySpan.classList.add('value-zero');
            }
            animateCounterFlash();
        }
        
        // изменить значение (шаг может быть положительным или отрицательным)
        function changeValue(step) {
            currentValue += step;
            updateDisplay();
        }
        
        // сброс на ноль
        function resetToZero() {
            currentValue = 0;
            updateDisplay();
        }
        
        // обработчики для кнопок увеличения
        incButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const incVal = parseInt(btn.getAttribute('data-inc'), 10);
                if (!isNaN(incVal)) {
                    changeValue(incVal);
                }
            });
        });
        
        // уменьшение
        decButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const decVal = parseInt(btn.getAttribute('data-dec'), 10);
                if (!isNaN(decVal)) {
                    changeValue(-decVal);   // отрицательный шаг
                }
            });
        });
        
        // сброс
        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            resetToZero();
        });
        
        // поддержка клавиатуры: стрелка вверх = +1, стрелка вниз = -1, R/r = сброс
        window.addEventListener('keydown', (e) => {
            // стрелка вверх
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                changeValue(1);
            }
            // стрелка вниз
            else if (e.key === 'ArrowDown') {
                e.preventDefault();
                changeValue(-1);
            }
            // сброс по клавише R / r
            else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                resetToZero();
            }
            // дополнительные: можно обработать цифровые клавиши быстрых шагов? не обязательно, но если удобно: 
            // по желанию: цифры 1,5,0 (для 10,20,50) – но лучше не перегружать, оставим чистый UX.
            // добавим небольшую фишку: SHIFT + стрелка вверх = +5, SHIFT + стрелка вниз = -5 (для удобства)
            if (e.shiftKey) {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    changeValue(5);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    changeValue(-5);
                }
            }
            // Ctrl + стрелка вверх = +10, Ctrl + вниз = -10
            if (e.ctrlKey) {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    changeValue(10);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    changeValue(-10);
                }
            }
        });
        
        // начальное отображение
        updateDisplay();
    })();
</script>
</body>
</html>
